name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12', '13']
        include:
          - laravel: '12'
            testbench: '10'
          - laravel: '13'
            testbench: '11'
    name: PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with: { php-version: '${{ matrix.php }}', extensions: pcntl, coverage: none }
      - run: composer require "laravel/framework:^${{ matrix.laravel }}.0" "orchestra/testbench:^${{ matrix.testbench }}.0" --no-update --no-interaction
      - run: composer update --no-interaction --prefer-dist
      - run: vendor/bin/pint --test
      # Analysed against the newest Laravel only: Laravel 12's property types differ slightly.
      - run: vendor/bin/phpstan analyse
        if: matrix.laravel == '13'
      - run: vendor/bin/pest

  # Installs the package into a fresh Laravel app, which catches dependency
  # conflicts with what real apps lock (psr/http-message 2.0 broke react/http).
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { path: package }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.5', coverage: none }
      - run: composer create-project laravel/laravel app --no-interaction --prefer-dist
      - working-directory: app
        run: |
          composer config repositories.watch '{"type": "path", "url": "../package", "options": {"symlink": false}}'
          composer require "codeva/laravel-watch:*@dev" --no-interaction
          php artisan watch:install --token=cw_ci --url=https://watch.example.test --no-interaction
          php artisan about --only=environment
