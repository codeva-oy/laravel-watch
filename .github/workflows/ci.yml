name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12', '13']
        include:
          - laravel: '12'
            testbench: '10'
          - laravel: '13'
            testbench: '11'
    name: PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with: { php-version: '${{ matrix.php }}', extensions: pcntl, coverage: none }
      - run: composer require "laravel/framework:^${{ matrix.laravel }}.0" "orchestra/testbench:^${{ matrix.testbench }}.0" --no-update --no-interaction
      - run: composer update --no-interaction --prefer-dist
      - run: vendor/bin/pint --test
      # Analysed against the newest Laravel only: Laravel 12's property types differ slightly.
      - run: vendor/bin/phpstan analyse
        if: matrix.laravel == '13'
      - run: vendor/bin/pest
